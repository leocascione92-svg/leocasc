name: Build HoleyLight S24 clone

on:
  workflow_dispatch:
  push:
    branches: [ s24-clone ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Checkout original HoleyLight source
        uses: actions/checkout@v4
        with:
          repository: Chainfire/HoleyLight
          ref: cd767e7cb7b53daf1f31558618e0896177a19612
          path: upstream

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 31 using runner SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-31" "build-tools;31.0.0"

      - name: Switch to Java 8 for legacy Gradle build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Restore legacy dependency repositories
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          old = """allprojects {
              repositories {
                  google()
                  jcenter()
              }
          }"""
          new = """allprojects {
              repositories {
                  google()
                  mavenCentral()
                  jcenter()
                  maven { url 'https://jitpack.io' }
              }
          }"""
          if old not in s:
              raise SystemExit("allprojects repositories block not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Apply S24 cutout fix
        run: python3 scripts/apply_s24_fix.py

      - name: Apply clone identity
        run: python3 scripts/apply_clone_identity.py

      - name: Show source diff
        run: git -C upstream diff -- app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/eu/chainfire/holeylight/animation/Overlay.java app/src/main/java/eu/chainfire/holeylight/misc/AODControl.java app/src/main/res/values/strings.xml app/src/main/res/values/ic_launcher_background_jh.xml

      - name: Make Gradle wrapper executable
        working-directory: upstream
        run: chmod +x gradlew

      - name: Show tool versions
        working-directory: upstream
        run: |
          java -version
          ./gradlew --version

      - name: Configure release signing
        working-directory: upstream
        env:
          HOLEY_KEYSTORE_B64: ${{ secrets.HOLEY_KEYSTORE_B64 }}
          HOLEY_STORE_PASSWORD: ${{ secrets.HOLEY_STORE_PASSWORD }}
          HOLEY_KEY_ALIAS: ${{ secrets.HOLEY_KEY_ALIAS }}
          HOLEY_KEY_PASSWORD: ${{ secrets.HOLEY_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, base64

          p = Path("app/build.gradle")
          s = p.read_text()

          have_stable = all(os.environ.get(k) for k in [
              "HOLEY_KEYSTORE_B64",
              "HOLEY_STORE_PASSWORD",
              "HOLEY_KEY_ALIAS",
              "HOLEY_KEY_PASSWORD",
          ])

          if have_stable:
              signing_dir = Path("signing")
              signing_dir.mkdir(exist_ok=True)
              (signing_dir / "holeylight-s24.jks").write_bytes(
                  base64.b64decode(os.environ["HOLEY_KEYSTORE_B64"])
              )

              anchor = "android {\n"
              signing = """android {
    signingConfigs {
        stableRelease {
            storeFile file("signing/holeylight-s24.jks")
            storePassword System.getenv("HOLEY_STORE_PASSWORD")
            keyAlias System.getenv("HOLEY_KEY_ALIAS")
            keyPassword System.getenv("HOLEY_KEY_PASSWORD")
        }
    }
"""
              if anchor not in s:
                  raise SystemExit("android block not found")
              s = s.replace(anchor, signing, 1)
              config = "signingConfigs.stableRelease"
              print("Using stable release signing from GitHub Secrets")
          else:
              config = "signingConfigs.debug"
              print("Stable signing Secrets not configured; using disposable debug signing")

          pattern = r"(release\s*\{\s*\n)(\s*)minifyEnabled true"
          replacement = r"\1\2signingConfig " + config + r"\n\2minifyEnabled true"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit("release buildType insertion point not found")
          p.write_text(s2)
          PY

      - name: Build S24 release APK
        working-directory: upstream
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          APK="$(find upstream/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" out/HoleyLight-S24-CLONE.apk
          sha256sum out/HoleyLight-S24-CLONE.apk | tee out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoleyLight-S24-CLONE
          path: out/*
          if-no-files-found: error
