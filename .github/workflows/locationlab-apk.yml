name: LocationLab Android APK

on:
  push:
    branches: [locationlab-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract LocationLab source
        run: tar -xJf LocationLab-source.tar.xz
      - name: Build installable debug APK
        working-directory: LocationLab
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp LocationLab/app/build/outputs/apk/debug/app-debug.apk LocationLab-v0.2-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocationLab-v0.2-debug
          path: LocationLab-v0.2-debug.apk
          if-no-files-found: error
          retention-days: 90
