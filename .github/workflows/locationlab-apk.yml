name: LocationLab Android APK

on:
  push:
    branches: [locationlab-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract LocationLab source
        run: tar -xJf LocationLab-source.tar.xz
      - name: Package current Android sources for review
        run: zip -q -r LocationLab-source-current.zip LocationLab -x '*/build/*' '*/.gradle/*'
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: LocationLab-source-current
          path: LocationLab-source-current.zip
          retention-days: 7
      - name: Build installable debug APK
        working-directory: LocationLab
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp LocationLab/app/build/outputs/apk/debug/app-debug.apk LocationLab-1.0.apk
      - name: Verify APK signature and package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose LocationLab-1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging LocationLab-1.0.apk | head -n 8
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocationLab-1.0-APK
          path: LocationLab-1.0.apk
          if-no-files-found: error
          retention-days: 90
