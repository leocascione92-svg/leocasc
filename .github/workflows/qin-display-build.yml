name: Qin Display - Build APK
on:
  push:
    branches: [qin-display-diagnostica]
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build read-only APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qin-Display-Diagnostica-0.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct-download APK
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Qin-Display-Diagnostica-0.3.apk
          sha256sum releases/Qin-Display-Diagnostica-0.3.apk > releases/SHA256-0.3.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Qin-Display-Diagnostica-0.3.apk releases/SHA256-0.3.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build Qin Display Diagnostica 0.3 APK"
            git push origin HEAD:qin-display-diagnostica
          fi
